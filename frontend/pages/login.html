<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Masahati</title>
  <link rel="stylesheet" href="../css/auth.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>

<body>

  <div class="auth-page">

    <button class="dark-mode-toggle" id="darkToggle" aria-label="Toggle dark mode">
      <i class="fa-solid fa-moon" id="darkToggleIcon"></i>
    </button>

    <!-- Left: Photo + tagline -->
    <div class="auth-left">
      <img class="bg-photo" src="../assets/images/login.png" alt="workspace" />
      <div class="auth-left-content">
        <h2>Work Better.<br><span>Focus More.</span></h2>
        <p>Find the perfect workspace that inspires productivity.</p>
      </div>
    </div>

    <!-- Right: Login form -->
    <div class="auth-right">
      <a href="../index.html" class="back-home-btn" aria-label="Back to Home">
        <i class="fa-solid fa-arrow-left"></i>
        <span>Back to Home</span>
      </a>
      <div class="auth-card">
        <h1>Welcome <br>Back!</h1>
        <p class="auth-subtitle">Login to your account to continue</p>

        <form id="loginForm" novalidate>

          <div class="form-group">
            <label for="email">Email</label>
            <div class="input-wrapper">
              <i class="fa-regular fa-envelope input-icon"></i>
              <input type="email" id="email" name="email" placeholder="Enter your email" autocomplete="email" />
            </div>
            <span class="input-error" id="emailError">Please enter a valid email.</span>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <div class="input-wrapper">
              <i class="fa-solid fa-lock input-icon"></i>
              <input type="password" id="password" name="password" placeholder="Enter your password"
                autocomplete="current-password" />
              <button type="button" class="toggle-password" data-target="password" aria-label="Toggle password">
                <i class="fa-regular fa-eye"></i>
              </button>
            </div>
            <span class="input-error" id="passwordError">Password is required.</span>
          </div>

          <div class="auth-options">
            <label class="remember-me">
              <input type="checkbox" name="remember" id="remember" />
              Remember Me
            </label>
            <a href="#" class="forgot-link">Forgot Password?</a>
          </div>

          <button type="submit" class="btn-primary">Login</button>

          <div class="auth-divider">OR</div>

          <p class="auth-switch">
            Don't have an account? <a href="signup.html">Sign Up</a>
          </p>

        </form>
      </div>
    </div>

  </div>

  <script src="../js/auth.js"></script>
  <script>
    const toggle = document.getElementById('darkToggle');
    const icon = document.getElementById('darkToggleIcon');
    const savedDM = localStorage.getItem('masahati_dark_auth') === 'true';
    if (savedDM) { document.body.classList.add('dark-mode'); icon.className = 'fa-solid fa-sun'; }
    toggle.addEventListener('click', () => {
      const isDark = document.body.classList.toggle('dark-mode');
      icon.className = isDark ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
      localStorage.setItem('masahati_dark_auth', isDark);
    });
  </script>
  <div id="toast"></div>

</body>

</html>
